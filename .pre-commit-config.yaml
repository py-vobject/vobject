# Run all hooks on the oldest supported CPython.  Bump this, and black's
# --target-version below, along with the test matrix in
# .github/workflows/test.yml and env_list in pyproject.toml.
default_language_version:
  python: python3.10

repos:
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        args:
          [
            "--target-version=py310",
          ]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: no-commit-to-branch
        args: [ -b, main, -b, master ]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies: [ flake8-pyproject ]

  - repo: https://github.com/pylint-dev/pylint
    rev: v4.1.4
    hooks:
      - id: pylint
        # Lets pylint import vobject's own dependencies.
        additional_dependencies: [ python-dateutil, pytz ]
        args:
          [
            "-rn", # Only display messages
            "-sn", # Don't display the score
          ]
